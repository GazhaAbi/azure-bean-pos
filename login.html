<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Bean POS — Login Pegawai</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#0c4a7e",
            "primary-container": "#135c9a",
            "primary-dark": "#062846",
            "secondary": "#082c4f",
            "tertiary": "#8c5532",
            "coffee": "#6b4028",
            "crema": "#e0b27e",
            "surface": "#f4f7fb",
            "on-surface": "#0c1e2e",
            "on-surface-variant": "#4a5d6e",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#edf3f8",
            "surface-container": "#e1ebf3",
            "surface-container-high": "#d4e2ed",
            "outline": "#6b8093",
            "outline-variant": "#c9d8e5",
          },
          fontFamily: { "sans": ["Inter", "sans-serif"] },
        }
      }
    }
  </script>
  <script src="assets/js/db.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f7fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Subtle coffee bean / delftware geometric background */
    .login-bg {
      background-color: #edf3f9;
      background-image:
        radial-gradient(ellipse 24px 18px at 60px 50px, transparent 60%, rgba(12,74,126,0.03) 61%, rgba(12,74,126,0.03) 100%),
        radial-gradient(ellipse 24px 18px at 140px 130px, transparent 60%, rgba(12,74,126,0.03) 61%, rgba(12,74,126,0.03) 100%),
        linear-gradient(135deg, rgba(12,74,126,0.04) 25%, transparent 25%),
        linear-gradient(225deg, rgba(12,74,126,0.04) 25%, transparent 25%),
        linear-gradient(315deg, rgba(12,74,126,0.04) 25%, transparent 25%),
        linear-gradient(45deg, rgba(12,74,126,0.04) 25%, transparent 25%);
      background-size: 200px 200px;
      background-position: 0 0;
    }

    /* Decorative corner accents */
    .login-wrapper::before,
    .login-wrapper::after {
      content: '';
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }
    .login-wrapper::before {
      top: -120px;
      right: -100px;
      background: radial-gradient(circle, rgba(12,74,126,0.07) 0%, transparent 70%);
    }
    .login-wrapper::after {
      bottom: -140px;
      left: -100px;
      background: radial-gradient(circle, rgba(140,85,50,0.06) 0%, transparent 70%);
    }
  </style>
</head>
<body class="login-bg login-wrapper min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-3xl shadow-[0_16px_45px_rgba(12,74,126,0.12)] border border-[#c9d8e5]/80 p-8 flex flex-col gap-6 relative z-10">
    <!-- Header / Logo Delftware Motif -->
    <div class="flex flex-col items-center text-center gap-3">
      <div class="w-24 h-24 rounded-full p-1 bg-white shadow-[0_8px_25px_rgba(12,74,126,0.14)] border-2 border-[#0c4a7e]/25 flex items-center justify-center transition-transform hover:scale-105">
        <img src="assets/img/azure_bean_logo.jpg" alt="Azure Bean Coffee" class="w-full h-full object-cover rounded-full">
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-[#0c4a7e] tracking-tight">Azure Bean Coffee</h1>
        <p class="text-xs text-[#4a5d6e] mt-1 font-medium">Portal Khusus Pegawai & Kasir · Delftware Edition</p>
      </div>
    </div>

    <!-- Error Alert -->
    <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-2xl flex items-center gap-2">
      <span class="material-symbols-outlined text-base">error</span>
      <span id="login-error-text"></span>
    </div>

    <!-- Form Login -->
    <form id="login-form" onsubmit="handleLoginSubmit(event)" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5">Username</label>
        <div class="flex items-center gap-3 bg-[#f6f3f5] px-4 py-3 rounded-2xl border border-transparent focus-within:border-primary focus-within:bg-white transition-all">
          <span class="material-symbols-outlined text-on-surface-variant text-xl">person</span>
          <input type="text" id="input-username" required placeholder="Contoh: kasir1 / admin"
            class="bg-transparent border-none outline-none flex-1 text-sm text-on-surface placeholder-on-surface-variant/60 focus:ring-0">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5">Kata Sandi</label>
        <div class="flex items-center gap-3 bg-[#f6f3f5] px-4 py-3 rounded-2xl border border-transparent focus-within:border-primary focus-within:bg-white transition-all">
          <span class="material-symbols-outlined text-on-surface-variant text-xl">lock</span>
          <input type="password" id="input-password" required placeholder="••••••••"
            class="bg-transparent border-none outline-none flex-1 text-sm text-on-surface placeholder-on-surface-variant/60 focus:ring-0">
        </div>
      </div>

      <button type="submit"
        class="w-full h-12 mt-2 rounded-2xl bg-primary hover:bg-primary-container text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-md shadow-primary/25 active:scale-98 transition-all">
        <span class="material-symbols-outlined text-lg">login</span>
        <span>Masuk ke Sistem Kasir</span>
      </button>
    </form>

    <!-- Link ke Tampilan Pelanggan / Responden -->
    <div class="bg-primary/5 rounded-2xl p-4 text-center border border-primary/10">
      <p class="text-xs text-on-surface-variant mb-1.5">Bukan pegawai kafe?</p>
      <a href="menu.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-primary hover:underline">
        <span class="material-symbols-outlined text-sm">smartphone</span>
        <span>Buka Menu Mandiri Pelanggan (HP / Meja)</span>
      </a>
    </div>
  </div>

  <script>
    // Cek jika sudah login, langsung lempar ke index.html
    document.addEventListener('DOMContentLoaded', () => {
      const user = DB.getAuthUser();
      if (user) {
        window.location.href = 'index.html';
      }
    });

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('input-username').value.trim();
      const p = document.getElementById('input-password').value.trim();
      const errBox = document.getElementById('login-error');
      const errText = document.getElementById('login-error-text');

      const res = DB.login(u, p);
      if (res.success) {
        errBox.classList.add('hidden');
        window.location.href = 'index.html';
      } else {
        errText.textContent = res.message;
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
