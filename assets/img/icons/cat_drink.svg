<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Filter Drop Shadow -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0c4a7e" flood-opacity="0.18"/>
    </filter>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1f8"/>
    </linearGradient>

    <!-- Drink Body Gradient (Fresh Blue Ocean / Iced Azure) -->
    <linearGradient id="drinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#093a63"/>
      <stop offset="25%" stop-color="#0e5a96"/>
      <stop offset="60%" stop-color="#1976d2"/>
      <stop offset="85%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#0c4a7e"/>
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Straw Gradient (Striped Coral/Teal) -->
    <linearGradient id="strawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="50%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>

    <!-- Ice Cube Gradients -->
    <linearGradient id="iceCube1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bbdefb" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="iceCube2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#90caf9" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Lemon Slice -->
    <linearGradient id="lemonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
  </defs>

  <!-- Ground Soft Contact Shadow -->
  <ellipse cx="80" cy="140" rx="42" ry="9" fill="#0c4a7e" opacity="0.14"/>
  <ellipse cx="80" cy="139" rx="32" ry="6" fill="#0c4a7e" opacity="0.22"/>

  <!-- Straw (Back segment sticking in) -->
  <path d="M96 20 L108 50 L90 110" stroke="url(#strawGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Straw inner hole -->
  <ellipse cx="95" cy="19" rx="3" ry="1.5" fill="#bf360c"/>

  <!-- Glass Cup Base Geometry -->
  <g filter="url(#shadow3d)">
    <!-- Cup Body Back -->
    <path d="M52 50 L58 126 C59 133 67 136 80 136 C93 136 101 133 102 126 L108 50 Z" fill="#e1f5fe" opacity="0.6"/>

    <!-- Liquid In Glass -->
    <path d="M54 62 L59 124 C60 130 68 133 80 133 C92 133 100 130 101 124 L106 62 C98 67 82 67 54 62 Z" fill="url(#drinkGrad)"/>
    <!-- Liquid Surface Ellipse -->
    <ellipse cx="80" cy="62" rx="26" ry="7" fill="#42a5f5"/>
    <ellipse cx="79" cy="61" rx="23" ry="5.5" fill="#64b5f6"/>
    <ellipse cx="78" cy="60" rx="18" ry="3.5" fill="#90caf9" opacity="0.7"/>

    <!-- 3D Ice Cubes Floating -->
    <!-- Ice Cube 1 (Left) -->
    <g transform="translate(62, 54) rotate(-14)">
      <polygon points="0,5 12,0 20,4 8,9" fill="#ffffff" opacity="0.95"/>
      <polygon points="0,5 8,9 8,20 0,16" fill="url(#iceCube1)"/>
      <polygon points="8,9 20,4 20,15 8,20" fill="url(#iceCube2)"/>
    </g>

    <!-- Ice Cube 2 (Right) -->
    <g transform="translate(82, 58) rotate(16)">
      <polygon points="0,4 10,0 17,3 7,7" fill="#ffffff" opacity="0.95"/>
      <polygon points="0,4 7,7 7,16 0,13" fill="url(#iceCube1)"/>
      <polygon points="7,7 17,3 17,12 7,16" fill="url(#iceCube2)"/>
    </g>

    <!-- Straw Front Overlay Inside Glass -->
    <path d="M100 48 L92 95" stroke="url(#strawGrad)" stroke-width="6.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Lemon Wedge on Rim (3D Garnish) -->
    <g transform="translate(50, 42) rotate(-32)">
      <!-- Lemon Rind -->
      <path d="M0 16 A 16 16 0 0 1 32 16 Z" fill="#fbc02d" stroke="#f57f17" stroke-width="1.5"/>
      <!-- Lemon Pulp -->
      <path d="M2 15 A 14 14 0 0 1 30 15 Z" fill="url(#lemonYellow)"/>
      <!-- Pulp Segments -->
      <path d="M16 15 L6 9 M16 15 L16 3 M16 15 L26 9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Cup Front Glass Sheen & Reflections (3D Gloss) -->
    <!-- Glass Lip Rim -->
    <ellipse cx="80" cy="50" rx="28" ry="6.5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="80" cy="50" rx="27.5" ry="6" fill="none" stroke="#81d4fa" stroke-width="1" opacity="0.7"/>

    <!-- Left Specular Reflection Streak -->
    <path d="M57 56 L62 122 C63 125 65 127 67 127 L65 128 C62 128 60 125 59 122 L54 56 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Secondary Right Curved Highlight -->
    <path d="M103 58 L99 120 C98 123 96 125 94 125 L95 126 C97 126 99 123 100 120 L104 58 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Condensation Water Drops (Realistic 3D Touch) -->
    <circle cx="70" cy="85" r="1.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="71" cy="95" r="2.2" fill="#ffffff" opacity="0.8"/>
    <circle cx="92" cy="88" r="1.6" fill="#ffffff" opacity="0.75"/>
    <circle cx="88" cy="106" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="78" cy="115" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
