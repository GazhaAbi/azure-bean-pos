<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Soft Contact Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0c4a7e" flood-opacity="0.22"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Linear Gradients for 3D Isometric Cafe Storefront -->
    <!-- Base Plate -->
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce8f2"/>
    </linearGradient>

    <!-- Roof & Awning Blue -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146cb3"/>
      <stop offset="50%" stop-color="#0c4a7e"/>
      <stop offset="100%" stop-color="#072d4e"/>
    </linearGradient>
    
    <!-- Awning White Stripes -->
    <linearGradient id="whiteStripeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9e6f2"/>
    </linearGradient>

    <!-- Building Walls -->
    <linearGradient id="wallFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2edf6"/>
    </linearGradient>
    <linearGradient id="wallSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0e0ed"/>
      <stop offset="100%" stop-color="#b8cfe0"/>
    </linearGradient>

    <!-- Warm Coffee Glass Window -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8cc"/>
      <stop offset="50%" stop-color="#ffd8a8"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>

    <!-- Door / Coffee Accent -->
    <linearGradient id="coffeeWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c5532"/>
      <stop offset="100%" stop-color="#543019"/>
    </linearGradient>

    <!-- Gold Accent / Crema -->
    <linearGradient id="cremaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#e67700"/>
    </linearGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="80" cy="142" rx="52" ry="12" fill="#0c4a7e" opacity="0.16"/>
  <ellipse cx="80" cy="140" rx="38" ry="8" fill="#0c4a7e" opacity="0.25"/>

  <!-- 3D Isometric Base Pedestal (Ceramic Disc) -->
  <ellipse cx="80" cy="126" rx="56" ry="17" fill="url(#wallSideGrad)"/>
  <ellipse cx="80" cy="122" rx="56" ry="17" fill="url(#pedestalGrad)" stroke="#c9d8e5" stroke-width="1"/>

  <!-- Building Main Body -->
  <!-- Left Wall (Shaded) -->
  <path d="M 46 72 L 80 88 L 80 120 L 46 104 Z" fill="url(#wallSideGrad)"/>
  <!-- Front Wall (Lit) -->
  <path d="M 80 88 L 114 72 L 114 104 L 80 120 Z" fill="url(#wallFrontGrad)"/>

  <!-- Front Door (Warm Coffee Wood) -->
  <path d="M 92 89 L 108 81 L 108 110 L 92 117 Z" fill="url(#coffeeWood)" rx="2"/>
  <path d="M 94 91 L 106 85 L 106 100 L 94 105 Z" fill="#ffe8cc" opacity="0.4"/>
  <!-- Door Golden Handle -->
  <circle cx="96" cy="104" r="1.5" fill="url(#cremaGold)"/>

  <!-- Left Wall Window with Warm Coffee Shop Glow -->
  <path d="M 52 82 L 74 92 L 74 108 L 52 98 Z" fill="url(#windowGlow)" stroke="#0c4a7e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Window Glaze / Frame -->
  <path d="M 63 87 L 63 103" stroke="#0c4a7e" stroke-width="1.2"/>
  <path d="M 52 90 L 74 100" stroke="#0c4a7e" stroke-width="1.2"/>
  <!-- Steaming Coffee Cup in Window -->
  <ellipse cx="63" cy="99" rx="3.5" ry="2" fill="#8c5532"/>
  <path d="M 63 94 C 61 92, 65 91, 63 89" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- 3D Striped Awning (Canopy) with Delft Royal Blue & White -->
  <!-- Awning Top Slope -->
  <path d="M 40 68 L 80 86 L 120 68 L 80 50 Z" fill="#082c4f"/>
  
  <!-- Stripe 1 (Side Left - Blue) -->
  <path d="M 40 68 L 48 72 L 56 61 L 48 58 Z" fill="url(#cobaltGrad)"/>
  <!-- Stripe 2 (White) -->
  <path d="M 48 72 L 56 75 L 64 64 L 56 61 Z" fill="url(#whiteStripeGrad)"/>
  <!-- Stripe 3 (Blue) -->
  <path d="M 56 75 L 64 79 L 72 68 L 64 64 Z" fill="url(#cobaltGrad)"/>
  <!-- Stripe 4 (White) -->
  <path d="M 64 79 L 72 82 L 80 71 L 72 68 Z" fill="url(#whiteStripeGrad)"/>
  <!-- Stripe 5 (Center Ridge - Blue) -->
  <path d="M 72 82 L 80 86 L 88 75 L 80 71 Z" fill="url(#cobaltGrad)"/>
  <!-- Stripe 6 (White) -->
  <path d="M 80 86 L 88 82 L 96 71 L 88 75 Z" fill="url(#whiteStripeGrad)"/>
  <!-- Stripe 7 (Blue) -->
  <path d="M 88 82 L 96 79 L 104 68 L 96 71 Z" fill="url(#cobaltGrad)"/>
  <!-- Stripe 8 (White) -->
  <path d="M 96 79 L 104 75 L 112 64 L 104 68 Z" fill="url(#whiteStripeGrad)"/>
  <!-- Stripe 9 (Side Right - Blue) -->
  <path d="M 104 75 L 112 72 L 120 61 L 112 64 Z" fill="url(#cobaltGrad)"/>

  <!-- Awning Valance (Scalloped Edges for 3D Depth) -->
  <path d="M 40 68 Q 44 73 48 72 Q 52 76 56 75 Q 60 80 64 79 Q 68 83 72 82 Q 76 87 80 86 Q 84 85 88 82 Q 92 81 96 79 Q 100 77 104 75 Q 108 74 112 72 L 112 70 L 40 66 Z" fill="#0c4a7e" opacity="0.3"/>

  <!-- Top Delft Signboard ("AZURE CAFE / ALL") -->
  <path d="M 60 42 L 100 42 L 100 54 L 60 54 Z" fill="url(#cobaltGrad)" rx="3" filter="url(#softShadow)"/>
  <rect x="62" y="44" width="36" height="8" rx="2" fill="none" stroke="#e0b27e" stroke-width="1"/>
  
  <!-- Signboard Emblem: 3D Coffee Bean & Grid Dots -->
  <circle cx="71" cy="48" r="2.5" fill="#e0b27e"/>
  <circle cx="80" cy="48" r="2.5" fill="#ffffff"/>
  <circle cx="89" cy="48" r="2.5" fill="#e0b27e"/>
  
  <!-- Rooftop Ceramic Chimney with Steaming Coffee Aromas -->
  <path d="M 94 36 L 102 36 L 102 46 L 94 46 Z" fill="url(#wallSideGrad)"/>
  <ellipse cx="98" cy="36" rx="4" ry="1.5" fill="url(#cobaltGrad)"/>
  <!-- Steam Curves -->
  <path d="M 98 32 C 95 28, 101 26, 98 22 C 96 19, 100 17, 98 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 103 30 C 101 27, 105 25, 103 21" stroke="#e0b27e" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Specular Highlights / Gloss on Awning -->
  <path d="M 44 65 L 78 49 L 80 50 L 46 67 Z" fill="#ffffff" opacity="0.45"/>
  <circle cx="80" cy="86" r="3" fill="#ffffff" opacity="0.6"/>
</svg>