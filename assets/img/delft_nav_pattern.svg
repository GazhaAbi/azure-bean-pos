<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Delft Porcelain Nav Base Tint -->
  <rect width="80" height="80" fill="#ebf2f8"/>
  
  <!-- Outer Grout Line -->
  <rect x="0.5" y="0.5" width="79" height="79" fill="none" stroke="#0c4a7e" stroke-width="1" stroke-opacity="0.14" rx="1"/>

  <!-- Corner 1: Top-Left -->
  <g fill="#0c4a7e" fill-opacity="0.16">
    <path d="M0,0 L14,0 C11,3.5 7,8 0,10 Z"/>
    <path d="M0,0 L0,14 C3.5,11 8,7 10,0 Z"/>
    <circle cx="8.5" cy="8.5" r="1.6"/>
  </g>

  <!-- Corner 2: Top-Right -->
  <g transform="translate(80,0) scale(-1,1)" fill="#0c4a7e" fill-opacity="0.16">
    <path d="M0,0 L14,0 C11,3.5 7,8 0,10 Z"/>
    <path d="M0,0 L0,14 C3.5,11 8,7 10,0 Z"/>
    <circle cx="8.5" cy="8.5" r="1.6"/>
  </g>

  <!-- Corner 3: Bottom-Left -->
  <g transform="translate(0,80) scale(1,-1)" fill="#0c4a7e" fill-opacity="0.16">
    <path d="M0,0 L14,0 C11,3.5 7,8 0,10 Z"/>
    <path d="M0,0 L0,14 C3.5,11 8,7 10,0 Z"/>
    <circle cx="8.5" cy="8.5" r="1.6"/>
  </g>

  <!-- Corner 4: Bottom-Right -->
  <g transform="translate(80,80) scale(-1,-1)" fill="#0c4a7e" fill-opacity="0.16">
    <path d="M0,0 L14,0 C11,3.5 7,8 0,10 Z"/>
    <path d="M0,0 L0,14 C3.5,11 8,7 10,0 Z"/>
    <circle cx="8.5" cy="8.5" r="1.6"/>
  </g>

  <!-- Center Delft Medallion -->
  <circle cx="40" cy="40" r="13" fill="none" stroke="#0c4a7e" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="2,2"/>
  <circle cx="40" cy="40" r="7.5" fill="none" stroke="#0c4a7e" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="40" cy="40" r="2.4" fill="#0c4a7e" fill-opacity="0.20"/>

  <path d="M40,26 Q43,34 40,36.5 Q37,34 40,26 Z" fill="#0c4a7e" fill-opacity="0.16"/>
  <path d="M40,54 Q43,46 40,43.5 Q37,46 40,54 Z" fill="#0c4a7e" fill-opacity="0.16"/>
  <path d="M26,40 Q34,43 36.5,40 Q34,37 26,40 Z" fill="#0c4a7e" fill-opacity="0.16"/>
  <path d="M54,40 Q46,43 43.5,40 Q46,37 54,40 Z" fill="#0c4a7e" fill-opacity="0.16"/>
</svg>
