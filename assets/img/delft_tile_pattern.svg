<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Delft Tile Base Glaze -->
  <rect width="96" height="96" fill="#f4f7fb"/>
  
  <!-- Tile Border / Grout Joint (Garis Keramik Delft) -->
  <rect x="0.5" y="0.5" width="95" height="95" fill="none" stroke="#0c4a7e" stroke-width="1" stroke-opacity="0.12" rx="1.5"/>

  <!-- Corner 1: Top-Left (Ox-Head / Corner Leaf Motif) -->
  <g fill="#0c4a7e" fill-opacity="0.18">
    <path d="M0,0 L16,0 C13,4 8,9 0,11 Z"/>
    <path d="M0,0 L0,16 C4,13 9,8 11,0 Z"/>
    <circle cx="10" cy="10" r="1.8"/>
  </g>

  <!-- Corner 2: Top-Right -->
  <g transform="translate(96,0) scale(-1,1)" fill="#0c4a7e" fill-opacity="0.18">
    <path d="M0,0 L16,0 C13,4 8,9 0,11 Z"/>
    <path d="M0,0 L0,16 C4,13 9,8 11,0 Z"/>
    <circle cx="10" cy="10" r="1.8"/>
  </g>

  <!-- Corner 3: Bottom-Left -->
  <g transform="translate(0,96) scale(1,-1)" fill="#0c4a7e" fill-opacity="0.18">
    <path d="M0,0 L16,0 C13,4 8,9 0,11 Z"/>
    <path d="M0,0 L0,16 C4,13 9,8 11,0 Z"/>
    <circle cx="10" cy="10" r="1.8"/>
  </g>

  <!-- Corner 4: Bottom-Right -->
  <g transform="translate(96,96) scale(-1,-1)" fill="#0c4a7e" fill-opacity="0.18">
    <path d="M0,0 L16,0 C13,4 8,9 0,11 Z"/>
    <path d="M0,0 L0,16 C4,13 9,8 11,0 Z"/>
    <circle cx="10" cy="10" r="1.8"/>
  </g>

  <!-- Center Delft Medallion (Rosette & Coffee Filigree) -->
  <circle cx="48" cy="48" r="16" fill="none" stroke="#0c4a7e" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="2,2"/>
  <circle cx="48" cy="48" r="9" fill="none" stroke="#0c4a7e" stroke-width="1.2" stroke-opacity="0.16"/>
  <circle cx="48" cy="48" r="2.8" fill="#0c4a7e" fill-opacity="0.22"/>
  
  <!-- 4 Center Petals in Cobalt Blue -->
  <path d="M48,32 Q51.5,41 48,44 Q44.5,41 48,32 Z" fill="#0c4a7e" fill-opacity="0.18"/>
  <path d="M48,64 Q51.5,55 48,52 Q44.5,55 48,64 Z" fill="#0c4a7e" fill-opacity="0.18"/>
  <path d="M32,48 Q41,51.5 44,48 Q41,44.5 32,48 Z" fill="#0c4a7e" fill-opacity="0.18"/>
  <path d="M64,48 Q55,51.5 52,48 Q55,44.5 64,48 Z" fill="#0c4a7e" fill-opacity="0.18"/>

  <!-- 4 Diagonal Accent Dots -->
  <circle cx="39" cy="39" r="1.2" fill="#0c4a7e" fill-opacity="0.18"/>
  <circle cx="57" cy="39" r="1.2" fill="#0c4a7e" fill-opacity="0.18"/>
  <circle cx="39" cy="57" r="1.2" fill="#0c4a7e" fill-opacity="0.18"/>
  <circle cx="57" cy="57" r="1.2" fill="#0c4a7e" fill-opacity="0.18"/>
</svg>
